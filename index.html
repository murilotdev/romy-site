 ? '8%' : '0',\n      heroTitleMax: wide ? '75%' : 'none',\n      heroTitleSize: wide ? '8cqi' : '10vw',\n      sobrePhotoCol: wide ? '1 / 6' : '1 / -1',\n      sobreTextCol: wide ? '7 / 13' : '1 / -1',\n      sobreTextPad: wide ? '0' : '48px',\n      pubTextCol: wide ? '1 / 7' : '1 / -1',\n      pubBookCol: wide ? '8 / 13' : '1 / -1',\n      pubBookRow: wide ? '2' : '3',\n      faqHeadCol: wide ? '1 / 5' : '1 / -1',\n      faqListCol: wide ? '6 / 13' : '1 / -1',\n      tickerLoop: [...ticker, ...ticker, ...ticker, ...ticker].map(([serif, sans]) => ({ serif, sans })),\n      areas: [\n        ['Direito da Saúde', 'Defesa dos direitos dos pacientes perante planos de saúde e SUS.'],\n        ['Direito da Família e Sucessões', 'Guarda, alimentos, herança, testamentos e planejamento sucessório.'],\n        ['Divórcio e Separação', 'Processos consensuais e litigiosos, presenciais ou extrajudiciais.'],\n        ['Inventário e Partilha', 'Regularização de bens com agilidade judicial e extrajudicial.'],\n        ['Elaboração de Contratos', 'Redação e revisão de contratos civis e particulares.']\n      ].map(([name, desc], i) => ({ n: String(i + 1).padStart(2, '0'), name, desc, delay: i * 80 })),\n      diffs: [\n        ['Atendimento Personalizado', 'Você não é um número de processo aqui. Escuta genuína e atenção individualizada desde o primeiro contato.'],\n        ['Comunicação Clara', 'Sem juridiquês. Linguagem acessível em cada etapa do processo.'],\n        ['Dedicação Total', 'Presença ativa do início ao fim com comprometimento real com o seu bem-estar.']\n      ].map(([title, desc], i) => ({ n: String(i + 1).padStart(2, '0'), title, desc, delay: i * 140, offset: wide ? [0, 80, 160][i] + 'px' : '0px' })),\n      faqs: faqData.map(([q, a], i) => {\n        const open = !!this.state.open[i];\n        return {\n          n: String(i + 1).padStart(2, '0'), q, a, delay: i * 60,\n          rows: open ? '1fr' : '0fr', op: open ? 1 : 0, rot: open ? '45deg' : '0deg',\n          bar: open ? 'scaleX(1)' : 'scaleX(0)', qColor: open ? '#5C3D0A' : '#1A1A1A',\n          ring: open ? '#5C3D0A' : 'rgba(92,61,10,0.4)', ringBg: open ? '#5C3D0A' : 'transparent', plus: open ? '#C8BFA8' : '#5C3D0A',\n          toggle: () => this.toggle(i)\n        };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
